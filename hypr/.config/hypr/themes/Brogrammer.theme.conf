###### Brogrammer — palette (RGB + Alpha like your Catppuccin file) ######
$cyan       = rgb(2aa198)
$cyanAlpha  = 2aa198

$blue       = rgb(66d9ef)
$blueAlpha  = 66d9ef

$green      = rgb(99cc99)
$greenAlpha = 99cc99

$yellow     = rgb(ffcc66)
$yellowAlpha= ffcc66

$orange     = rgb(f99157)
$orangeAlpha= f99157

$red        = rgb(f2777a)
$redAlpha   = f2777a

$magenta    = rgb(cc99cc)
$magentaAlpha= cc99cc

$white      = rgb(f2f2f2)
$whiteAlpha = f2f2f2

$black      = rgb(1b1d1e)
$blackAlpha = 1b1d1e

$gray       = rgb(666666)
$grayAlpha  = 666666

$background = rgb(131313)
$backgroundAlpha = 131313

$foreground = rgb(f2f2f2)
$foregroundAlpha = f2f2f2

$accent     = rgb(66d9ef)
$accentAlpha= 66d9ef


###### Hyprland — color settings only (matches your Catppuccin layout) ######
general {
  # 2-color gradient active border @ 45°
  col.active_border = rgba($accentAlphaee) rgba($blueAlphaee) 45deg

  # Solid, slightly translucent inactive border
  col.inactive_border = rgba($grayAlphacc)
}

group {
  groupbar {
    # Tab backgrounds
    col.active         = rgba($accentAlphae6)
    col.inactive       = rgba($grayAlphacc)
    col.locked_active  = rgba($redAlphae6)
    col.locked_inactive= rgba($grayAlpha99)

    # Text colors
    text_color                 = $white
    text_color_inactive        = $gray
    text_color_locked_active   = $yellow
    text_color_locked_inactive = $gray
  }
}

