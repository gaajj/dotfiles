set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

# prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# window switching
bind -n C-o previous-window
bind -n C-p next-window

# splits
bind -n C-\\ split-window -h -c "#{pane_current_path}"
bind -n C-| split-window -v -c "#{pane_current_path}"

# pane resize
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# qol
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind x kill-pane
bind X kill-window
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# sessions
bind f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"
bind Q kill-session
bind l switch-client -l

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# status bar
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#908caa"

# left
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[fg=#232136 bg=#ea9a97 bold] #S #[default],#[fg=#e0def4 bold] #S #[default]} "

# center
setw -g window-status-format "#I:#W "
setw -g window-status-current-format "#[fg=#e0def4 bold]#I:#W #[default]"
setw -g window-status-separator ""

# right
set -g status-right-length 50
set -g status-right '#[fg=#908caa] #(if [ -n "$SSH_CONNECTION" ]; then echo "$(whoami)@$(hostname -s)"; else echo "$(whoami)"; fi)  %a %d %b %H:%M  '

# borders
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g popup-border-style "fg=#44415a"

# messages
set -g message-style "bg=default,fg=#e0def4"
set -g message-command-style "bg=default,fg=#e0def4"
set -g mode-style "bg=#44415a,fg=#e0def4"

