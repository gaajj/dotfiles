set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0

set-option -g default-command '${SHELL}'

set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color:RGB'

unbind C-b
set -g prefix C-s
bind C-s send prefix

bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display 'Config Reloaded!'

# Copy mode
set-window-option -g mode-keys vi
bind-key v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key o paste-buffer

# bind -n M-h resize-pane -L 5
# bind -n M-j resize-pane -D 5
# bind -n M-k resize-pane -U 5
# bind -n M-l resize-pane -R 5

set-option -g status-position top
set-option -g status-style bg=default,fg=default
set-option -g status-left-length 50
set-option -g status-left '#[fg=blue,bold]#S #[fg=red,nobold]#{?client_prefix,<PREFIX>,}'
set-option -g status-justify absolute-centre
set-option -g window-status-format ' #I:#W '
set-option -g window-status-current-style 'fg=colour214,bold'
set-option -g window-status-current-format '#[underscore] #I:#W '
set-option -g status-right-length 50
set-option -g status-right '%a %d %b %H:%M'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
