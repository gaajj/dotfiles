# prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# general
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g buffer-limit 20
set -g escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g aggressive-resize on
set -g focus-events on
set -g set-clipboard on

# numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# mouse
set -g mouse on

# vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip 2>/dev/null || xsel --clipboard 2>/dev/null || true"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# new window keeps cwd
bind c new-window -c "#{pane_current_path}"

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-o previous-window
bind -n M-p next-window

# quick actions
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind S command-prompt -p "new session:" "new-session -s '%%'"

# sync panes
bind y setw synchronize-panes \; display "sync #{?pane_synchronized,ON,OFF}"

# sessionizer
bind f display-popup -E -w 60% -h 60% "tmux-sessionizer"
bind g display-popup -E -w 60% -h 60% "tmux-sessionizer --existing"

# status bar
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#908caa"
# left
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[fg=#232136 bg=#ea9a97 bold] #S #[default],#[fg=#e0def4 bold] #S #[default]} "
# center
setw -g window-status-format "#I:#W "
setw -g window-status-current-format "#[fg=#e0def4 bold]#I:#W #[default]"
setw -g window-status-separator ""
# right
set -g status-right-length 50
set -g status-right '#[fg=#908caa] #(if [ -n "$SSH_CONNECTION" ]; then echo "$(whoami)@$(hostname -s)"; else echo "$(whoami)"; fi)  %a %d %b %H:%M  '
# borders
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g popup-border-style "fg=#44415a"

# messages
set -g message-style "bg=default,fg=#e0def4"
set -g message-command-style "bg=default,fg=#e0def4"
set -g mode-style "bg=#44415a,fg=#e0def4"

# misc
set -g detach-on-destroy off
bind x kill-pane
bind b switch-client -l

# easy exit SSH session (uncomment if wanted)
# bind A detach -E "exit"
